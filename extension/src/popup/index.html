<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Trakk setup</title></head>
  <body>
    <main>
      <header class="popup-hero">
        <div class="brand"><img id="brandMark" alt="" /><span>trakk</span><small>GMAIL</small></div>
        <p>Know what happens after you send.</p>
      </header>
      <section class="setup-card">
        <div class="section-heading"><span>Secure setup</span><strong>Connect your dashboard</strong></div>
        <form id="settings">
          <label>Web app URL<input id="appUrl" type="url" required placeholder="https://trakk.example.com" /></label>
          <label>Extension secret<input id="extensionSecret" type="password" required placeholder="Shared secret from webapp" /></label>
          <label>InboxSDK app ID<input id="inboxSdkAppId" required placeholder="sdk_your_registered_app_id" /></label>
          <p id="notice" role="status"></p>
          <button><span>Save connection</span><b aria-hidden="true">→</b></button>
        </form>
      </section>
      <footer><span class="secure-dot" /> Stored only in this browser.</footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
